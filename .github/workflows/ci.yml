name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @milanos/shared build

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Type check API
        run: pnpm --filter @milanos/api type-check

      - name: Type check Web
        run: pnpm --filter @milanos/web type-check

  build-api:
    name: Build API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @milanos/shared build

      - name: Generate Prisma Client
        run: pnpm --filter @milanos/api db:generate

      - name: Build API
        run: pnpm --filter @milanos/api build

      - name: Test default-off API route boundary
        run: pnpm --filter @milanos/api exec vitest run src/app.ordering-disabled.test.ts

  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @milanos/shared build

      - name: Build Web
        run: pnpm --filter @milanos/web build
        env:
          SITE_ENV: staging
          ORDER_PROVIDER: skytab
          ORDER_MODE: redirect
          SKYTAB_ORDER_URL: https://online.skytab.com/29f9af1c8689260fadade27c64cb9e55
          SKYTAB_IFRAME_ENABLED: 'false'
          CUSTOM_ORDERING_ENABLED: 'false'
          CUSTOM_PAYMENT_ENABLED: 'false'
          ANALYTICS_ENABLED: 'false'

      - name: Validate static site output
        run: pnpm --filter @milanos/web validate:static

      - name: Build production with hostile iframe settings
        run: pnpm --filter @milanos/web build
        env:
          SITE_ENV: production
          ORDER_PROVIDER: skytab
          ORDER_MODE: iframe
          SKYTAB_ORDER_URL: https://online.skytab.com/29f9af1c8689260fadade27c64cb9e55
          SKYTAB_IFRAME_ENABLED: 'true'
          CUSTOM_ORDERING_ENABLED: 'false'
          CUSTOM_PAYMENT_ENABLED: 'false'
          ANALYTICS_ENABLED: 'false'

      - name: Validate production redirect safety
        run: pnpm --filter @milanos/web validate:static
