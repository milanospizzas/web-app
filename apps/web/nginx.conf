server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;

  location / {
    rewrite ^(.+)/$ $1 permanent;
    try_files $uri.html $uri/index.html $uri =404;
  }

  location = /network {
    return 410;
  }

  location = /network/ {
    return 410;
  }

  location ~* \.(?:avif|webp|jpg|jpeg|png|svg|css|js|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
