name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY after production launch approval'
        required: true
        type: string

jobs:
  deploy-api:
    name: Deploy API to Sevalla
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @milanos/shared build
          pnpm --filter @milanos/api db:generate
          pnpm --filter @milanos/api build

      - name: Deploy to Sevalla
        run: |
          echo "Deploy API to Sevalla"
          # Add Sevalla deployment commands here
        env:
          SEVALLA_API_KEY: ${{ secrets.SEVALLA_API_KEY }}

  deploy-web:
    name: Deploy Web to AWS Amplify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @milanos/shared build
          pnpm --filter @milanos/web build
        env:
          SITE_ENV: production
          ORDER_PROVIDER: skytab
          ORDER_MODE: redirect
          SKYTAB_ORDER_URL: https://online.skytab.com/29f9af1c8689260fadade27c64cb9e55
          SKYTAB_IFRAME_ENABLED: 'false'
          CUSTOM_ORDERING_ENABLED: 'false'
          CUSTOM_PAYMENT_ENABLED: 'false'
          ANALYTICS_ENABLED: 'false'

      - name: Deploy to AWS Amplify
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Trigger Amplify deployment
        run: |
          echo "Trigger AWS Amplify deployment"
          # Add Amplify deployment commands here
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
