version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: milanos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: milanos_pizza
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: milanos-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # API (Fastify)
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: development
    container_name: milanos-api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/milanos_pizza
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      SESSION_SECRET: dev-secret-change-in-production
      CUSTOM_ORDERING_ENABLED: 'false'
      CUSTOM_PAYMENT_ENABLED: 'false'
      ACCOUNTS_ENABLED: 'false'
      TAX_RATE: 0.0825
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
      - /app/apps/api/dist
      - /app/packages/shared/dist
    working_dir: /app
    command: pnpm --filter @milanos/api dev

  # Web (Next.js)
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: development
    container_name: milanos-web
    environment:
      NODE_ENV: development
      SITE_ENV: staging
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ORDER_PROVIDER: skytab
      ORDER_MODE: redirect
      SKYTAB_ORDER_URL: https://online.skytab.com/29f9af1c8689260fadade27c64cb9e55
      SKYTAB_IFRAME_ENABLED: 'false'
      CUSTOM_ORDERING_ENABLED: 'false'
      CUSTOM_PAYMENT_ENABLED: 'false'
      ANALYTICS_ENABLED: 'false'
    ports:
      - '3000:3000'
    depends_on:
      - api
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
      - /app/apps/web/.next
    command: pnpm --filter @milanos/web dev

volumes:
  postgres_data:
  redis_data:
