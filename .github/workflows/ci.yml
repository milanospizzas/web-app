name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @milanos/shared build

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Type check API
        run: pnpm --filter @milanos/api type-check

      - name: Type check Web
        run: pnpm --filter @milanos/web type-check

  build-api:
    name: Build API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @milanos/shared build

      - name: Generate Prisma Client
        run: pnpm --filter @milanos/api db:generate

      - name: Build API
        run: pnpm --filter @milanos/api build

      - name: Test complete API suite
        run: pnpm --filter @milanos/api test

  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @milanos/shared build

      - name: Build Web
        run: pnpm --filter @milanos/web build
        env:
          SITE_ENV: staging
          ORDER_PROVIDER: skytab
          ORDER_MODE: redirect
          SKYTAB_ORDER_URL: https://online.skytab.com/29f9af1c8689260fadade27c64cb9e55
          SKYTAB_IFRAME_ENABLED: 'false'
          CUSTOM_ORDERING_ENABLED: 'false'
          CUSTOM_PAYMENT_ENABLED: 'false'
          ANALYTICS_ENABLED: 'false'

      - name: Validate static site output
        run: pnpm --filter @milanos/web validate:static

      - name: Build production with hostile iframe settings
        run: pnpm --filter @milanos/web build
        env:
          SITE_ENV: production
          ORDER_PROVIDER: skytab
          ORDER_MODE: iframe
          SKYTAB_ORDER_URL: https://online.skytab.com/29f9af1c8689260fadade27c64cb9e55
          SKYTAB_IFRAME_ENABLED: 'true'
          CUSTOM_ORDERING_ENABLED: 'false'
          CUSTOM_PAYMENT_ENABLED: 'false'
          ANALYTICS_ENABLED: 'false'

      - name: Validate production redirect safety
        run: pnpm --filter @milanos/web validate:static

  container-build-and-web-smoke:
    name: Container Build and Web Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API production image
        run: |
          docker build \
            --file apps/api/Dockerfile \
            --target production \
            --tag milanos-api-pr \
            .

      - name: Inspect API production image
        shell: bash
        run: |
          set -euo pipefail

          image='milanos-api-pr'

          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          configured_user="$(docker image inspect --format '{{.Config.User}}' "$image")"
          [ "$configured_user" = 'node' ] ||
            fail "API image Config.User must be node; got '${configured_user:-<empty>}'"

          runtime_user="$(docker run --rm --network none --entrypoint id "$image" -un)"
          runtime_uid="$(docker run --rm --network none --entrypoint id "$image" -u)"
          [ "$runtime_user" = 'node' ] ||
            fail "API image runtime user must be node; got '$runtime_user'"
          [ "$runtime_uid" != '0' ] ||
            fail 'API image runtime UID must be nonzero'

          openssl_path="$(
            docker run --rm --network none --entrypoint sh "$image" -c \
              'openssl_path="$(command -v openssl)" && test -x "$openssl_path" && printf "%s\n" "$openssl_path"'
          )"
          openssl_version="$(
            docker run --rm --network none --entrypoint openssl "$image" version
          )"
          case "$openssl_version" in
            'OpenSSL 3.'*) ;;
            *) fail "API image must provide OpenSSL 3.x; got '$openssl_version'" ;;
          esac
          printf 'API image user: %s (uid %s)\nOpenSSL: %s (%s)\n' \
            "$runtime_user" "$runtime_uid" "$openssl_version" "$openssl_path"

          docker run --rm --network none --entrypoint sh "$image" -c '
            set -eu
            for required_file in \
              /app/apps/api/dist/index.js \
              /app/apps/api/prisma/schema.prisma \
              /app/apps/api/prisma/migrations/migration_lock.toml
            do
              test -f "$required_file" || {
                echo "Missing API image file: $required_file" >&2
                exit 1
              }
            done

            migration_files="$(
              find /app/apps/api/prisma/migrations -type f -name migration.sql -print
            )"
            test -n "$migration_files" || {
              echo "API image contains no Prisma migration.sql files" >&2
              exit 1
            }
            printf "API image entrypoint, schema, and migrations are present\n%s\n" \
              "$migration_files"
          '

          prisma_version="$(
            docker run --rm --network none \
              --env CI=1 \
              --env CHECKPOINT_DISABLE=1 \
              --env PRISMA_HIDE_UPDATE_MESSAGE=true \
              --workdir /app/apps/api \
              --entrypoint sh \
              "$image" \
              -c './node_modules/.bin/prisma version 2>&1'
          )"
          printf '%s\n' "$prisma_version"

          if printf '%s\n' "$prisma_version" |
            grep -Eqi 'failed to detect.*(libssl|openssl)'; then
            fail 'Prisma emitted an OpenSSL detection warning'
          fi

          computed_target="$(
            printf '%s\n' "$prisma_version" |
              sed -n 's/^Computed binaryTarget[[:space:]]*:[[:space:]]*//p'
          )"
          [ "$computed_target" = 'linux-musl-openssl-3.0.x' ] ||
            fail "Unexpected Prisma binaryTarget '$computed_target'"

          docker run --rm --network none \
            --workdir /app/apps/api \
            --entrypoint node \
            "$image" \
            -e '
              const prisma = require("@prisma/client");
              if (typeof prisma.PrismaClient !== "function") {
                throw new Error("@prisma/client did not expose PrismaClient");
              }
              process.stdout.write("@prisma/client require passed\n");
            '

      - name: Build web production image
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --target production \
            --build-arg SITE_ENV=production \
            --build-arg ORDER_PROVIDER=skytab \
            --build-arg ORDER_MODE=iframe \
            --build-arg SKYTAB_ORDER_URL=https://online.skytab.com/29f9af1c8689260fadade27c64cb9e55 \
            --build-arg SKYTAB_IFRAME_ENABLED=true \
            --build-arg CUSTOM_ORDERING_ENABLED=false \
            --build-arg CUSTOM_PAYMENT_ENABLED=false \
            --build-arg ANALYTICS_ENABLED=false \
            --tag milanos-web-pr \
            .

      - name: Start web container on loopback
        run: |
          docker run --detach \
            --name milanos-web-smoke \
            --publish 127.0.0.1:8080:80 \
            milanos-web-pr

      - name: Smoke test web container
        shell: bash
        run: |
          set -euo pipefail

          base_url='http://127.0.0.1:8080'
          export NO_PROXY='127.0.0.1'

          for attempt in {1..20}; do
            if curl --noproxy '*' --silent --show-error --fail \
              --connect-timeout 2 --max-time 5 \
              --output /dev/null "${base_url}/"; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              docker logs milanos-web-smoke || true
              exit 1
            fi

            sleep 1
          done

          assert_status() {
            local expected="$1"
            local path="$2"
            local output="${3:-/dev/null}"
            local actual

            actual="$(
              curl --noproxy '*' --silent --show-error \
                --connect-timeout 2 --max-time 5 \
                --output "$output" \
                --write-out '%{http_code}' \
                "${base_url}${path}"
            )"

            if [ "$actual" != "$expected" ]; then
              echo "::error::${path} returned ${actual}; expected ${expected}"
              return 1
            fi
          }

          order_html="$(mktemp)"
          trap 'rm -f "$order_html"' EXIT

          assert_status 200 /
          assert_status 200 /order "$order_html"
          assert_status 200 /menu/pizza
          assert_status 410 /network

          redirect_result="$(
            curl --noproxy '*' --silent --show-error \
              --connect-timeout 2 --max-time 5 \
              --output /dev/null \
              --write-out '%{http_code}\n%{redirect_url}\n' \
              "${base_url}/menu/pizza/"
          )"

          redirect_status="$(
            printf '%s\n' "$redirect_result" |
              sed -n '1p'
          )"

          redirect_url="$(
            printf '%s\n' "$redirect_result" |
              sed -n '2p'
          )"

          expected_redirect="${base_url}/menu/pizza"

          if [ "$redirect_status" != '301' ]; then
            echo "::error::Trailing-slash route returned ${redirect_status}; expected 301"
            exit 1
          fi

          if [ "$redirect_url" != "$expected_redirect" ]; then
            echo "::error::Trailing-slash redirect resolved to '${redirect_url:-<empty>}'; expected '${expected_redirect}'"
            exit 1
          fi

          if ! grep -Fq '\"mode\":\"redirect\"' "$order_html"; then
            echo '::error::Production-safe redirect mode was not serialized'
            exit 1
          fi

          if grep -Fq '\"mode\":\"iframe\"' "$order_html" ||
            grep -Fq '\"iframeEnabled\":true' "$order_html"; then
            echo '::error::Production order HTML serialized active iframe configuration'
            exit 1
          fi

      - name: Remove web smoke container
        if: always()
        run: docker rm --force milanos-web-smoke >/dev/null 2>&1 || true
